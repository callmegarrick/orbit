const TOUCH_CHEERS = ["Nice — {n} will feel that 💛", "One more kept close ✨", "That's how bonds stay alive 🌿", "Look at you, showing up 👏", "{n}'s day just got a little brighter ☀️", "Small hello, big deal 🌟", "You're the friend people are lucky to have 🤍"];
const CLEAR_LINES = ["Nothing needs you right now — go live your life.", "All clear. The people who matter are close.", "Done. Go be present somewhere real.", "Empty list, full heart. Off you go.", "Caught up. That's what being good at this looks like.", "Clear skies. The garden's watered."];
/* Milestones reward the OUTCOME — real connection — and each fires only once. */
function checkMilestones(p) {
  S.settings.milestones = S.settings.milestones ?? {};
  const fired = S.settings.milestones;
  const first = p.name.split(" ")[0];
  const dates = (p.interactions ?? []).map(i => i.date).sort();
  const touches = dates.length;
  // reconnected after a long silence
  if (touches >= 2) {
    const gap = Math.round((fromISO(dates[touches - 1]) - fromISO(dates[touches - 2])) / DAY);
    const k = `reconnect:${p.id}:${dates[touches - 1]}`;
    if (gap >= Math.max(45, p.cadence * 3) && !fired[k]) { fired[k] = todayISO(); return `💫 You reconnected with ${first} after ${Math.round(gap / 30)} months apart — that took heart`; }
  }
  // first ever touch
  if (touches === 1 && !fired[`first:${p.id}`]) { fired[`first:${p.id}`] = todayISO(); return `🌟 ${first} is officially one of your people`; }
  // catch-up count milestones
  for (const m of [10, 25, 50, 100]) {
    const k = `count:${p.id}:${m}`;
    if (touches === m && !fired[k]) { fired[k] = todayISO(); return `🌿 ${m} catch-ups with ${first} — that's a real bond`; }
  }
  return null;
}

    case "tab": activeTab = el.dataset.tab; render(); break;

    case "add-occasion": occasionModal(); break;
    case "history": historyModal(S.people.find(p => p.id === id)); break;
    case "log": e.stopPropagation(); logTouch(id, undefined, el.dataset.via); break;
    case "msg": e.stopPropagation(); msgModal(id); break;
    case "msg-shuffle": msgModal(id, "none", el.dataset.sit || "checkin"); break;
    case "msg-general": msgModal(id, "none"); break;
    case "msg-sit": msgModal(id, el.dataset.sit === "followup" ? undefined : "none", el.dataset.sit); break;
    case "msg-save": {
      const p = S.people.find(x => x.id === id);
      const raw = ($("#msgForm textarea")?.value ?? "").trim();
      if (!p || !raw) { toast("Write something first, then save it"); break; }
      const tpl = toSavedTemplate(raw, p);
      S.settings.savedMsgs = [tpl, ...(S.settings.savedMsgs ?? []).filter(s => s !== tpl)].slice(0, 12);
      save();
      toast("Saved to ⭐ Mine. It'll use each person's own name.");
      break;
    }
    case "mine-del": {
      const i = Number(el.dataset.i);
      if (S.settings.savedMsgs?.[i] !== undefined) { S.settings.savedMsgs.splice(i, 1); save(); }
      msgModal(id, "none", "mine");
      break;
    }
    case "fu-new": e.stopPropagation(); $("#toast").classList.remove("show"); followupModal(id); break;
    case "fu-edit": {
      e.stopPropagation();
      const fu = S.followups.find(x => x.id === id);
      if (fu) followupModal(fu.personId, fu);
      break;
    }
    case "fu-msg": {
      e.stopPropagation();
      const fu = S.followups.find(x => x.id === id);
      if (fu) { closeModal(); msgModal(fu.personId, fu.id); }
      break;

    case "fu-done": {
      e.stopPropagation();

      completeFollowup(id, false, el.dataset.via);
      break;
    }

    case "note-last": e.stopPropagation(); $("#toast").classList.remove("show"); noteLastModal(id); break;
    case "wa-then-ask": {

      const t = S.tasks.find(x => x.id === id);
      const prev = t.lastDone;
      t.lastDone = todayISO(); save(); render();
      celebrate(elCenter(el));
      toast(`${t.name} done ✓ — next ${fmtNice(taskState(t).due)}`, () => { t.lastDone = prev; save(); render(); });
      break;
    }
    case "del-person": {
      const p = S.people.find(x => x.id === id);
      if (!confirm(`Remove ${p.name} and their history?`)) break;
      S.people = S.people.filter(x => x.id !== id);
      S.followups = S.followups.filter(f => f.personId !== id);
      save(); closeModal(); render(); toast(`${p.name} removed`);
      break;
    }
    case "del-task": {
      S.tasks = S.tasks.filter(x => x.id !== id);
      save(); closeModal(); render();
      break;
    }
    case "del-touch": {
      // by position, so deleting one touch doesn't take out others logged the same day
      const p = S.people.find(x => x.id === id);
      const i = Number(el.dataset.i);
      if (p && p.interactions?.[i]) {
        const [gone] = p.interactions.splice(i, 1);
        save(); historyModal(p); render();
        toast("Touch deleted", () => { p.interactions.splice(i, 0, gone); save(); historyModal(p); render(); });
      }
      break;
    }
    case "touch-via": {
      const p = S.people.find(x => x.id === id);
      const t = p?.interactions?.[Number(el.dataset.i)];
      if (t) {
        const order = [undefined, "text", "call", "met"];
        const next = order[(order.indexOf(t.via) + 1) % order.length];
        if (next) t.via = next; else delete t.via;
        save(); historyModal(p);
      }
      break;
    }
    case "del-occasion": {
      S.occasions = S.occasions.filter(o => o.id !== id);
      save(); render();
      break;
    }
    case "toggle-occasion": {
      const o = S.occasions.find(x => x.id === id);
      o.enabled = el.checked; save();
      break;
    }
    case "open-queue": e.stopPropagation(); queueModal(id); break;
    case "open-review": reviewModal(); break;
    case "add-note": noteModal(); break;
    case "edit-note": noteModal(S.notes.find(x => x.id === id)); break;
    case "del-note": {
      const nt = S.notes.find(x => x.id === id);
      S.notes = S.notes.filter(x => x.id !== id);
      save(); closeModal(); render();
      toast("Note deleted", () => { S.notes.push(nt); save(); render(); });
      break;
    }
    case "toggle-show-all": showAll = !showAll; render(); break;
    case "logo-spin": {
      const brand = el.closest(".brand");
      brand.classList.remove("spun"); void brand.offsetWidth; brand.classList.add("spun");
      logoTaps++;
      if (logoTaps === 7) { celebrate({ big: true }); toast("You found the secret 🛸 — made with care, for the people you love."); logoTaps = 0; }
      break;
    }
    case "focus-start": focusQueue = [...rightNowSnapshot]; focusIdx = 0; focusModal(); break;
    case "focus-end": closeModal(); render(); break;
    case "focus-skip": focusAdvance(); break;
    case "focus-msg": { closeModal(); msgModal(id); break; }
    case "focus-occ": { closeModal(); queueModal(id); break; }
    case "focus-done": {
      const item = focusQueue[focusIdx];
      const today = todayISO();
      if (item.kind === "person") {
        const p = S.people.find(x => x.id === item.id);
        if (p) { p.interactions = p.interactions ?? []; p.interactions.push({ date: today }); p.snoozedUntil = null; }
      } else if (item.kind === "todo") {
        const td = S.todos.find(x => x.id === item.id);
        if (td) {
          td.done = true; td.doneAt = today;
          const tp = td.personId ? S.people.find(p => p.id === td.personId) : null;
          if (tp) { tp.interactions = tp.interactions ?? []; tp.interactions.push({ date: today, note: td.text }); tp.snoozedUntil = null; }
        }
      } else if (item.kind === "plan") {
        const pl = S.plans.find(x => x.id === item.id);
        if (pl) {
          pl.done = true; pl.doneAt = today;
          const tp = pl.personId ? S.people.find(p => p.id === pl.personId) : null;
          if (tp) { tp.interactions = tp.interactions ?? []; tp.interactions.push({ date: today, note: pl.title, via: "met" }); tp.snoozedUntil = null; }
        }
      } else if (item.kind === "routine") {
        const t = S.tasks.find(x => x.id === item.id);
        if (t) t.lastDone = today;
      } else if (item.kind === "followup") {
        completeFollowup(item.id, true);
      }
      save(); focusAdvance();
      break;
    }
    case "focus-push": {
      const item = focusQueue[focusIdx];
      const tmrw = addDays(todayISO(), 1);
      if (item.kind === "person") { const p = S.people.find(x => x.id === item.id); if (p) p.snoozedUntil = tmrw; }
      else if (item.kind === "todo") { const td = S.todos.find(x => x.id === item.id); if (td) td.date = tmrw; }
      else if (item.kind === "plan") { const pl = S.plans.find(x => x.id === item.id); if (pl) pl.date = tmrw; }
      else if (item.kind === "followup") { const fu = S.followups.find(x => x.id === item.id); if (fu) fu.date = tmrw; }
      save(); focusAdvance();
      break;
    }
    case "todo-toggle": {
      e.stopPropagation();
      const td = S.todos.find(x => x.id === id);
      td.done = !td.done;
      td.doneAt = td.done ? todayISO() : null;
      const tp = td.personId ? S.people.find(p => p.id === td.personId) : null;
      if (tp) {
        tp.interactions = tp.interactions ?? [];
        if (td.done) {
          tp.interactions.push({ date: todayISO(), note: td.text });
          tp.snoozedUntil = null;
        } else {
          const i = tp.interactions.findIndex(x => x.date === todayISO() && x.note === td.text);
          if (i >= 0) tp.interactions.splice(i, 1);
        }
      }
      const msT = td.done && tp ? checkMilestones(tp) : null;
      save(); render();
      if (td.done) celebrate(elCenter(el));
      if (msT) toast(msT);
      else if (td.done && tp) toast(`✓ counted as a touch with ${tp.name.split(" ")[0]}`);
      break;
    }
    case "todo-del": {
      e.stopPropagation();
      const td = S.todos.find(x => x.id === id);
      S.todos = S.todos.filter(x => x.id !== id);
      save(); render();
      toast(`Removed "${td.text.slice(0, 30)}${td.text.length > 30 ? "…" : ""}"`, () => { S.todos.push(td); save(); render(); });
      break;
    }
    case "add-plan": e.stopPropagation(); planModal(null, el.dataset.date); break;
    case "edit-plan": e.stopPropagation(); planModal(S.plans.find(x => x.id === id)); break;
    case "del-plan": {
      S.plans = S.plans.filter(x => x.id !== id);
      save(); closeModal(); render();
      break;
    }
    case "plan-gcal": {
      e.stopPropagation();
      window.open(gcalLink(S.plans.find(x => x.id === id)), "_blank", "noopener");
      break;
    }
    case "plan-done": {
      e.stopPropagation();
      const pl = S.plans.find(x => x.id === id);
      pl.done = true; pl.doneAt = todayISO();
      const person = pl.personId ? S.people.find(p => p.id === pl.personId) : null;
      if (person) {
        person.interactions = person.interactions ?? [];
        person.interactions.push({ date: todayISO(), note: pl.title, via: "met" });
        person.snoozedUntil = null;
      }
      const msP = person ? checkMilestones(person) : null;
      save(); render();
      celebrate(elCenter(el));
      toast(msP || `${pl.title} ✓${person ? ` — counted as a touch with ${person.name.split(" ")[0]}` : ""}`, () => {
        pl.done = false; delete pl.doneAt;
        if (person) person.interactions.pop();
        save(); render();
      });
      break;
    }
    case "relax-cadence": {
      const p = S.people.find(x => x.id === id);
      const steps = [7, 14, 30, 60, 90, 180, 365];
      p.cadence = steps.find(s => s > p.cadence) ?? 365;
      save(); render();
      toast(`${p.name}: now every ${p.cadence} days — honest beats heroic`);
      reviewModal();
      break;
    }
    case "queue-send": {
      e.preventDefault();
      const o = S.occasions.find(x => x.id === el.dataset.occ);
      const p = S.people.find(x => x.id === id);
      const tpl = $("#occTpl")?.value || o.template || OCC_TPL;
      o.template = tpl;
      window.open(waLink(p, fillTemplate(tpl, p, o.name)), "_blank", "noopener");
      const year = el.dataset.year;
      o.done = o.done ?? {}; o.done[year] = o.done[year] ?? [];
      if (!o.done[year].includes(id)) o.done[year].push(id);
      // also count as a touch
      p.interactions = p.interactions ?? [];
      if (!p.interactions.some(i => i.date === todayISO())) p.interactions.push({ date: todayISO(), note: `${o.name} wishes`, via: "text" });
      save();
      setTimeout(() => queueModal(o.id), 300);
      break;
    }
    case "queue-undo": {
      const o = S.occasions.find(x => x.id === el.dataset.occ);
      const year = el.dataset.year;
      o.done[year] = (o.done[year] ?? []).filter(x => x !== id);
      save(); queueModal(o.id);
      break;
    }
    case "cal-nav": {
      let { y, m } = calCursor; m += Number(el.dataset.dir);
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      calCursor = { y, m }; calSelected = null; render();
      break;
    }
    case "cal-today": { const t = todayDate(); calCursor = { y: t.getFullYear(), m: t.getMonth() }; calSelected = todayISO(); render(); break; }
    case "cal-day": calSelected = el.dataset.date; render(); break;
    case "cal-mode": calMode = el.dataset.mode; render(); break;
    case "week-nav": weekOffset += Number(el.dataset.dir); render(); break;
    case "week-today": weekOffset = 0; render(); break;
    case "week-add": case "day-add": dayAddModal(el.dataset.date); break;
    case "day-add-plan": closeModal(); planModal(null, el.dataset.date); break;
    case "load-sample": {
      const s = SAMPLE();
      S.people.push(...s.people); S.tasks.push(...s.tasks); S.plans.push(...s.plans); S.todos.push(...s.todos); S.followups.push(...s.followups);
      save(); render(); toast("Example data loaded — remove it any time in Settings");
      break;
    }
    case "clear-sample": {
      S.people = S.people.filter(p => !p.sample);
      S.tasks = S.tasks.filter(t => !t.sample);
      S.plans = S.plans.filter(pl => !pl.sample);
      S.todos = S.todos.filter(td => !td.sample);
      S.followups = S.followups.filter(f => !f.sample && S.people.some(p => p.id === f.personId));
      save(); render(); toast("Example data removed");
      break;
    }
    case "export": doExport(); break;
    case "import": doImport(); break;
    case "setup-backup": setupAutoBackup(); break;
    case "csv-import": csvImport(); break;
    case "force-update": forceUpdate(); break;
    case "pick-contact": pickContact(); break;
    case "pick-contacts-bulk": pickContactsBulk(); break;
    case "reenable-backup": reenableBackup(); break;
    case "disable-backup": {
      backupHandle = null; backupBlocked = false;
      kvDel("backupHandle").then(() => { render(); toast("Auto-backup turned off"); });
      break;
    }
    case "wipe": {
      if (!confirm("Delete ALL Kith data on this device? Export a backup first if unsure.")) break;
      localStorage.removeItem("orbit-data"); S = load(); render(); toast("All data deleted");
      break;
    }
    case "enable-notif": {
      Notification.requestPermission().then(perm => {
        render();
        if (perm === "granted") { notifyDigest(true); registerPeriodicSync(); }
      });
      break;
    }
    case "test-notif": showNotification("Kith is watching the calendar 👋", "You'll hear from me when someone needs a hello."); break;
    case "undo": if (undoFn) { undoFn(); undoFn = null; } $("#toast").classList.remove("show"); break;
    case "close": closeModal(); break;
    case "close-overlay": if (e.target === el) closeModal(); break;
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const fd = new FormData(f);
  if (f.id === "personForm") {
    const id = f.dataset.id;
    const data = {
      name: fd.get("name").trim(),
      phone: fd.get("phone").trim(),
      cadence: Math.max(1, Number(fd.get("cadence")) || 30),
      birthday: fd.get("birthday") || "",
      tone: fd.get("tone") || "warm",
      circle: (fd.get("circle") ?? "").trim(),
      topics: parseTopics(fd.get("topics")),
      notes: fd.get("notes").trim(),
    };
    if (!data.name) return;
    if (id) Object.assign(S.people.find(p => p.id === id), data);
    else S.people.push({ id: uid(), createdAt: todayISO(), interactions: [], topics: [], ...data });
    save(); closeModal(); render();
    if (!id) toast(`${data.name} is now one of your people ✓`);
  } else if (f.id === "taskForm") {
    const id = f.dataset.id;
    const data = {
      name: fd.get("name").trim(),
      emoji: fd.get("emoji").trim() || "🔁",
      cadence: Math.max(1, Number(fd.get("cadence")) || 180),
      lastDone: fd.get("lastDone") || null,
    };
    if (id) Object.assign(S.tasks.find(t => t.id === id), data);
    else S.tasks.push({ id: uid(), createdAt: todayISO(), ...data });
    save(); closeModal(); render();
  } else if (f.id === "topicAddForm") {
    const p = S.people.find(x => x.id === f.dataset.id);
    const topic = (fd.get("topic") ?? "").trim();
    if (p && topic) { p.topics = [...(p.topics ?? []), topic].slice(0, 20); save(); msgModal(p.id); }
  } else if (f.id === "msgForm") {
    const p = S.people.find(x => x.id === f.dataset.id);
    const text = ($("#msgForm textarea")?.value ?? "").trim();
    const fu = f.dataset.fu ? S.followups.find(x => x.id === f.dataset.fu && !x.done) : null;
    openWA(p, text);
    closeModal();
    if (fu) offerAsked(p, fu); else offerLog(p);
  } else if (f.id === "followupForm") {
    const pid = f.dataset.pid, id = f.dataset.id;
    const about = (fd.get("about") ?? "").trim();
    let date = fd.get("date") || addDays(todayISO(), 3);
    if (date < todayISO()) date = todayISO();
    const p = S.people.find(x => x.id === pid);
    if (id) Object.assign(S.followups.find(x => x.id === id) ?? {}, { about, date });
    else addFollowup(pid, about, date);
    save(); closeModal(); render();
    if (p) toast(`⏰ ${about ? `Ask ${p.name.split(" ")[0]} about ${about}` : `Check in with ${p.name.split(" ")[0]}`}: ${fmtNice(date).toLowerCase()}`);
  } else if (f.id === "noteForm") {
    const id = f.dataset.id;
    const data = { title: (fd.get("title") ?? "").trim(), body: (fd.get("body") ?? "").trim(), pinned: !!fd.get("pinned"), updatedAt: new Date().toISOString() };
    if (!data.title && !data.body) { closeModal(); return; }
    if (id) Object.assign(S.notes.find(x => x.id === id), data);
    else S.notes.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
    save(); closeModal(); render();
    if (!id) toast("Note saved 📝");
  } else if (f.id === "dayAddForm") {
    const raw = (fd.get("text") ?? "").trim();
    if (!raw) return;
    const cap = parseCapture(raw);
    S.todos.push({ id: uid(), text: cap.text || raw, date: f.dataset.date, personId: cap.personId, createdAt: new Date().toISOString(), done: false });
    save(); closeModal(); render();
    toast(`Added to ${fmtNice(f.dataset.date).toLowerCase()} ✓`);
  } else if (f.id === "todoAddForm") {
    const raw = (fd.get("text") ?? "").trim();
    if (!raw) return;
    const fcap = parseFollowupCapture(raw);
    if (fcap) {
      const fu = addFollowup(fcap.personId, fcap.about, fcap.date);
      save(); render();
      const p = S.people.find(x => x.id === fu.personId);
      toast(`⏰ ${fuTitle(fu, p)}: ${fmtNice(fu.date).toLowerCase()}`, () => { S.followups = S.followups.filter(x => x.id !== fu.id); save(); render(); });
      setTimeout(() => { const inp = $("#todoAddForm input"); if (inp) inp.focus(); }, 30);
      return;
    }
    const cap = parseCapture(raw);
    if (!cap.text) return;
    S.todos.push({ id: uid(), text: cap.text, date: cap.date, personId: cap.personId, createdAt: new Date().toISOString(), done: false });
    save(); render();
    const bits = [];
    if (cap.date !== todayISO()) bits.push(fmtNice(cap.date));
    if (cap.personId) bits.push(`linked to ${S.people.find(p => p.id === cap.personId)?.name.split(" ")[0]}`);
    toast(`Got it${bits.length ? " — " + bits.join(" · ") : ""} ✓`);
    setTimeout(() => { const inp = $("#todoAddForm input"); if (inp) inp.focus(); }, 30);
  } else if (f.id === "planForm") {
    const id = f.dataset.id;
    const data = {
      title: fd.get("title").trim(),
      date: fd.get("date") || todayISO(),
      personId: fd.get("personId") || "",
      note: (fd.get("note") ?? "").trim(),
    };
    if (!data.title) return;
    if (id) Object.assign(S.plans.find(x => x.id === id), data);
    else S.plans.push({ id: uid(), done: false, createdAt: todayISO(), ...data });
    save(); closeModal(); render();
    if (!id) toast(`Planned: ${data.title} — ${fmtNice(data.date).toLowerCase()} 📌`);
  } else if (f.id === "noteLastForm") {
    const p = S.people.find(x => x.id === f.dataset.id);
    const note = (fd.get("note") ?? "").trim();
    const via = $("#noteVia .on")?.dataset.via;
    if (p?.interactions?.length && (note || via)) {
      // the touch just logged is the last one added, which is what this note is about
      const latest = p.interactions[p.interactions.length - 1];
      if (note) latest.note = note;
      if (via) latest.via = via;
      save(); render(); toast(note ? "Noted 📝 — it'll be there next time" : "Saved ✓");
    }
    closeModal();
  } else if (f.id === "logWhenForm") {
    logTouchOn(f.dataset.id, fd.get("date") || todayISO(), (fd.get("note") ?? "").trim(), $("#whenVia .on")?.dataset.via);
  } else if (f.id === "csvForm") {
    const cadence = Number(fd.get("cadence")) || 30;
    const picks = fd.getAll("pick").map(Number);
    if (!picks.length) { alert("Nothing ticked — tick at least one person to import."); return; }
    for (const i of picks) {
      const c = csvContacts[i];
      if (!c) continue;
      S.people.push({ id: uid(), name: c.name, phone: c.phone, birthday: c.birthday, cadence, notes: "", createdAt: todayISO(), interactions: [] });
    }
    save(); closeModal(); render();
    toast(`${picks.length} ${picks.length === 1 ? "person" : "people"} added ✓`);
  } else if (f.id === "bulkForm") {
    const { people, skipped } = parseBulk(fd.get("bulk") ?? "");
    if (!people.length) { alert("Couldn't find any names — start each line with a person's name."); return; }
    S.people.push(...people);
    save(); closeModal(); render();
    toast(`${people.length} ${people.length === 1 ? "person" : "people"} added to your orbit ✓${skipped.length ? ` · ${skipped.length} line${skipped.length === 1 ? "" : "s"} skipped` : ""}`);
  } else if (f.id === "occForm") {
    const type = fd.get("type"), date = fd.get("date");
    S.occasions.push({
      id: uid(), custom: true, enabled: true, done: {},
      name: fd.get("name").trim(), emoji: fd.get("emoji").trim() || "🎉",
      ...(type === "fixed" ? { fixed: date.slice(5) } : { once: date }),
    });
    save(); closeModal(); render();
  }
});

/* ---------- export / import ---------- */
function doExport() {
  const blob = new Blob([JSON.stringify({ app: "orbit", exportedAt: new Date().toISOString(), data: S }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `orbit-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Backup downloaded ⬇");
}
function doImport() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    try {
      const obj = JSON.parse(await inp.files[0].text());
      const data = obj.data ?? obj;
      if (!Array.isArray(data.people)) throw new Error("not an Kith backup");
      if (!confirm(`Import ${data.people.length} people and replace what's here now?`)) return;
      S = Object.assign(structuredClone(DEFAULTS), data);
      save(); render(); toast("Backup restored ✓");
    } catch (err) { alert("That file doesn't look like an Kith backup. " + err.message); }
  };
  inp.click();
}

/* ---------- notifications ---------- */
async function showNotification(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, icon: "icon.svg", badge: "icon.svg", tag: "orbit-digest" });
    else new Notification(title, { body, icon: "icon.svg" });
  } catch (e) { console.warn("notify failed", e); }
}
function digestText() {
  const od = S.people.map(p => ({ p, st: personState(p) })).filter(x => x.st.status === "late" && !x.st.snoozed);
  const bd = upcomingBirthdays(S.settings.birthdayLead);
  const oc = upcomingOccasions(S.settings.occasionLead);
  const bits = [];

/* ---------- auto-backup to a file (File System Access API, Chromium) ---------- */
const FSA = "showSaveFilePicker" in window;
let backupHandle = null, backupTimer = null, backupBlocked = false;
async function kvGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const g = db.transaction("kv").objectStore("kv").get(key);
    g.onsuccess = () => { res(g.result); db.close(); };
    g.onerror = () => { rej(g.error); db.close(); };
  });
}
async function kvPut(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, key);
    tx.oncomplete = () => { res(); db.close(); };
    tx.onerror = () => { rej(tx.error); db.close(); };
  });
}
async function kvDel(key) {
  const db = await idbOpen();
  return new Promise((res) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(key);
    tx.oncomplete = () => { res(); db.close(); };
    tx.onerror = () => { res(); db.close(); };
  });
}
async function setupAutoBackup() {
  try {
    backupHandle = await showSaveFilePicker({
      suggestedName: "orbit-backup.json",
      types: [{ description: "Kith backup", accept: { "application/json": [".json"] } }],
    });
    backupBlocked = false;
    await kvPut("backupHandle", backupHandle);
    await writeAutoBackup();
    render();
    toast("🛡 Auto-backup on — saving after every change");
  } catch (e) { /* picker cancelled */ }
}
async function writeAutoBackup() {
  if (!backupHandle) return;
  try {
    const w = await backupHandle.createWritable();
    await w.write(JSON.stringify({ app: "orbit", exportedAt: new Date().toISOString(), data: S }, null, 2));
    await w.close();
    backupBlocked = false;
    S.settings.lastAutoBackup = new Date().toISOString();
    localStorage.setItem("orbit-data", JSON.stringify(S)); // persist timestamp without re-entering save()
  } catch (e) { backupBlocked = true; }
}
function scheduleAutoBackup() {
  if (!backupHandle || backupBlocked) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(writeAutoBackup, 1500);
}
async function initAutoBackup() {
  if (!FSA) return;
  try {
    const h = await kvGet("backupHandle");
    if (!h) return;
    backupHandle = h;
    const perm = await h.queryPermission({ mode: "readwrite" });
    if (perm === "granted") writeAutoBackup();
    else {
      backupBlocked = true;
      const t = $("#toast");
      t.innerHTML = `🛡 Auto-backup needs one click to resume <button data-act="reenable-backup">Resume ✓</button>`;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 12000);
    }
  } catch (e) { /* no handle or IDB unavailable */ }
}
async function reenableBackup() {
  if (!backupHandle) return;
  try {
    const perm = await backupHandle.requestPermission({ mode: "readwrite" });
    if (perm === "granted") {
      backupBlocked = false;
      await writeAutoBackup();
      render();
      toast("Auto-backup resumed ✓");
    }
  } catch (e) { /* needs user gesture; button click provides it */ }
}

/* ---------- alerts mirror for the service worker (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("orbit-idb", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function mirrorAlertsToIDB() {
  try {
    // precompute next 30 days of alert lines so the SW can notify without app logic
    const alerts = [];
    for (let d = 0; d <= 30; d++) {
      const day = addDays(todayISO(), d);
      const lines = [];
      for (const p of S.people) {
        const st = personState(p);
        if (!st.snoozed && st.due <= day) { lines.push(`${p.name.split(" ")[0]} needs a hello`); break; }
      }
      for (const b of upcomingBirthdays(365)) if (b.date === day) lines.push(`🎂 ${b.p.name.split(" ")[0]}'s birthday`);
      for (const o of S.occasions.filter(o => o.enabled)) { const n = occasionNext(o); if (n === day) lines.push(`${o.emoji} ${o.name}`); }
      for (const pl of S.plans.filter(pl => !pl.done)) if (pl.date === day) lines.push(`📌 ${pl.title}`);
      for (const fu of S.followups.filter(f => !f.done && f.date === day)) { const p = S.people.find(x => x.id === fu.personId); if (p) lines.unshift(`⏰ ${fuTitle(fu, p)}`); }
      if (lines.length) alerts.push({ date: day, text: lines.slice(0, 3).join(" · ") });
    }
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(alerts, "alerts");
    tx.oncomplete = () => db.close();
  } catch (e) { /* IDB unavailable — background alerts just won't fire */ }
}

async function registerPeriodicSync() {

}

  let __reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (__reloading) return; __reloading = true; location.reload();
  });
}
async function forceUpdate() {

}
